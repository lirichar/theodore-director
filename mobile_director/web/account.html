<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号中心 · Theodore</title><link rel="stylesheet" href="/style.css"><style>main{max-width:900px;padding:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:18px;border-radius:16px;background:#f0efe8}.stat b{font-size:28px}.admin-only{display:none}.admin .admin-only{display:block}.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.form-row input,.form-row button{padding:11px;border:1px solid var(--line);border-radius:10px}.user{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.user-actions{display:flex;gap:6px;flex-wrap:wrap}.user button{padding:7px 9px}.code{font:700 18px monospace;padding:12px;background:#181b20;color:white;border-radius:10px;word-break:break-all}@media(max-width:600px){.form-row{grid-template-columns:1fr}.user{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brand"><b>T</b><div><strong>账号中心</strong><small id="identity">加载中</small></div></div><a class="account-link" href="/">返回导演台</a></header><main><section id="quotaCard" class="card"><h2>今日额度</h2><div class="stats"><div class="stat">视频<br><b id="videoQuota">不限</b></div><div class="stat">图片<br><b id="imageQuota">不限</b></div></div></section><section class="card admin-only"><h2>创建邀请码</h2><div class="form-row"><input id="inviteUses" type="number" min="1" value="1" placeholder="可注册人数"><input id="inviteDays" type="number" min="1" max="30" value="7" placeholder="有效天数"><button id="makeInvite">生成</button></div><div id="inviteCode"></div></section><section class="card admin-only"><h2>创建不限额公共账号</h2><p>所有公共账号共享公共素材库与结果库。</p><div class="form-row"><input id="publicName" placeholder="账号名"><input id="publicPassword" type="password" placeholder="初始密码（至少10位）"><button id="makePublic">创建</button></div></section><section class="card admin-only"><h2>账号管理</h2><div id="users"></div></section><section class="card"><button id="logout">退出登录</button><p id="message"></p></section></main><script src="/account.js"></script></body></html>
