<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2eb"><title>Theodore 手机导演台</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/frame.css"></head><body>
<header class="topbar"><div class="brand"><b>T</b><div><strong>Theodore Director</strong><small>MiniMax H3 移动导演台</small></div></div><div class="top-actions"><span id="status" class="status offline">检查中</span><a class="account-link" href="/account.html">账号中心</a><button id="menuToggle" type="button">☰</button></div></header>
<main><section class="hero"><div><span class="eyebrow">CREATE WITH MINIMAX H3</span><label class="project-label">项目名称 · 点击下方文字即可修改<input id="project" class="project" value="未命名影片"></label><p>选择模式、调用素材，然后直接开始生成。</p></div><div class="queue"><span>运行中 <b id="running">0</b></span><span>等待中 <b id="pending">0</b></span></div></section>
<nav class="tabs"><button class="active" data-tab="create">视频生成</button><button data-tab="qwen">图片编辑</button><button data-tab="director">分镜导演</button><button data-tab="assets">素材库</button><button data-tab="results">生成结果</button><a href="/help.html">使用说明</a></nav>
<section id="create" class="panel active"><div class="modes"><button class="mode active" data-mode="t2v"><b>文生视频</b><small>仅使用文字创作</small></button><button class="mode" data-mode="i2v"><b>图生视频</b><small>首帧＋可选尾帧</small></button><button class="mode" data-mode="r2v"><b>参考生视频</b><small>图片、视频与音频</small></button></div>
<div class="editor-card"><div class="row"><label>镜头标题<input id="title" value="镜头 1"></label><label class="duration">时长<input id="duration" type="number" min="5" max="15" value="5"><i>秒</i></label></div><div class="row output-settings"><label>视频比例<select id="aspect"><option value="16:9 (Widescreen)">16:9 横屏</option><option value="9:16 (Portrait Widescreen)">9:16 竖屏</option><option value="1:1 (Square)">1:1 方形</option><option value="4:3 (Standard)">4:3 标准</option><option value="3:4 (Portrait Standard)">3:4 竖版</option><option value="21:9 (Ultrawide)">21:9 超宽屏</option></select></label><label>输出清晰度<select id="resolution"><option value="0.4">标准 · 约 0.4MP</option><option value="0.7">高清 · 约 0.7MP</option><option value="1.0">超清 · 约 1.0MP</option></select></label></div><div id="slots" class="slots"></div><label>提示词<textarea id="prompt" rows="10" placeholder="输入场景、动作、镜头和声音；点击素材卡片可插入引用……"></textarea></label><label>负面提示词<textarea id="negative" rows="3"></textarea></label><div class="actions"><button id="saveDraft">保存草稿</button><button id="generate" class="primary">开始生成</button></div><pre id="message" class="message">等待操作</pre></div></section>
<section id="director" class="panel"><div class="editor-card"><div class="library-head"><div><h2>分镜导演</h2><p>组织多镜头脚本，再作为一个完整 H3 视频任务提交。</p></div><button id="addShot" type="button">＋ 添加分镜</button></div><div class="row output-settings"><label>视频模式<select id="directorMode"><option value="t2v">文生视频</option><option value="i2v">图生视频</option><option value="r2v">参考生视频</option></select></label><label>总时长<input id="directorDuration" type="number" min="5" max="15" value="5"></label></div><div class="row output-settings"><label>比例<select id="directorAspect"><option value="16:9 (Widescreen)">16:9 横屏</option><option value="9:16 (Portrait Widescreen)">9:16 竖屏</option><option value="1:1 (Square)">1:1 方形</option></select></label><label>清晰度<select id="directorResolution"><option value="0.4">标准 0.4MP</option><option value="0.7">高清 0.7MP</option><option value="1.0">超清 1.0MP</option></select></label></div><label>整体设定<textarea id="directorPrompt" rows="5" placeholder="人物、场景、风格和贯穿全片的声音设定"></textarea></label><section class="storyboard"><div id="shotList"></div></section><div class="actions"><span></span><button id="generateDirector" class="primary">生成分镜视频</button></div><pre id="directorMessage" class="message">等待操作</pre></div></section>
<section id="qwen" class="panel"><div class="editor-card"><div class="library-head"><div><h2>Qwen Image Edit 2511</h2><p>先在素材库选中 1–3 张图片，再返回这里编辑。</p></div></div><div class="modes qwen-modes"><button class="qmode active" data-qmode="instruction"><b>指令编辑</b><small>自由描述修改</small></button><button class="qmode" data-qmode="retouch"><b>修图增强</b><small>细节与画质</small></button><button class="qmode" data-qmode="style"><b>风格转换</b><small>保持内容换风格</small></button><button class="qmode" data-qmode="replace"><b>对象替换</b><small>替换人物或物体</small></button><button class="qmode" data-qmode="text"><b>文字编辑</b><small>添加或修改文字</small></button></div><div id="qwenSlots" class="slots"></div><label>编辑指令<textarea id="qwenPrompt" rows="8" placeholder="例如：保持人物不变，将背景改为雨夜东京街头"></textarea></label><label>负面提示词<textarea id="qwenNegative" rows="3"></textarea></label><div class="actions"><span></span><button id="generateQwen" class="primary">开始编辑图片</button></div><pre id="qwenMessage" class="message">等待操作</pre></div></section>
<section id="assets" class="panel"><div class="library-head"><div><h2>我的素材库</h2><p>上传后可在创作页直接选择并插入提示词。</p></div><label class="file">＋ 上传素材<input id="upload" type="file" accept="image/*,video/*,audio/*" multiple></label></div><div class="filters"><button class="active" data-kind="all">全部</button><button data-kind="image">图片</button><button data-kind="video">视频</button><button data-kind="audio">音频</button></div><div id="assetGrid" class="asset-grid"></div></section>
<section id="results" class="panel"><div class="library-head"><div><h2>生成结果库</h2><p>历史记录、重试和合并都集中在这里。</p></div><button id="merge" class="primary">合并所选</button></div><div id="resultGrid" class="result-grid"></div></section></main>
<script src="/app.js"></script></body></html>
