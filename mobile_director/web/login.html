<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theodore Director · 登录</title>
<link rel="stylesheet" href="/studio-v2.css">
<style>
body.auth-page{min-height:100dvh;overflow:auto;display:flex;flex-direction:column;background:var(--bg)}
.auth-page .brand{width:auto}.auth-page .appbar{flex-shrink:0}.auth-main{flex:1;display:grid;place-items:center;padding:48px 20px}
.auth-card{width:min(420px,100%);padding:32px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px #00000008}
.auth-card h1{margin:8px 0;font-size:25px;font-weight:650;letter-spacing:-.5px}.auth-intro{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.auth-tabs{display:flex;gap:20px;margin:24px 0 22px;border-bottom:1px solid var(--line)}.auth-tabs button{position:relative;flex:1;min-height:40px;padding:8px 0 12px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600}.auth-tabs button.active{color:var(--blue)}.auth-tabs button.active:after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:3px;border-radius:3px;background:var(--blue)}
.auth-form label{display:grid;gap:7px;margin-bottom:18px;font-size:12px;font-weight:600}.auth-form input{width:100%;height:40px;padding:8px 11px;border:1px solid #c8c6c4;border-radius:5px;background:#fff;color:var(--text);font:inherit;font-weight:400;outline:none}.auth-form input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.auth-form .primary{width:100%;min-height:40px;font-size:13px}.auth-form .primary:disabled{opacity:.6;cursor:wait}
.auth-form .invite{display:none}.register .auth-form .invite{display:grid}.message{min-height:20px;margin-top:12px;color:#a4262c;font-size:12px;line-height:1.5}.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.hint:empty{display:none}.auth-footer{padding:0 20px 24px;text-align:center;color:var(--subtle);font-size:11px}.auth-tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@media(max-width:480px){.auth-main{padding:28px 16px}.auth-card{padding:24px 20px}.auth-page .appbar{padding:0 16px}.auth-card h1{font-size:23px}}
</style>
</head>
<body class="auth-page">
<header class="appbar"><a class="brand" href="/studio.html"><span class="brand-mark">T</span><span>Theodore Director</span><em>Preview</em></a></header>
<main class="auth-main"><section class="auth-card" aria-labelledby="authTitle">
<span class="eyebrow">短剧创作工作空间</span>
<h1 id="authTitle">欢迎使用导演台</h1>
<p class="auth-intro" id="subtitle">登录后访问你的项目、素材与生成结果。</p>
<div class="auth-tabs" aria-label="账号操作"><button id="loginTab" class="active" type="button">登录</button><button id="registerTab" type="button">邀请码注册</button></div>
<form class="auth-form" id="form">
<label>账号<input id="username" autocomplete="username" required minlength="3" placeholder="请输入账号"></label>
<label>密码<input id="password" type="password" autocomplete="current-password" required minlength="10" placeholder="请输入密码"></label>
<label class="invite">邀请码<input id="invite" autocomplete="off" placeholder="请输入邀请码"></label>
<button class="primary" id="submit" type="submit">登录</button>
<div class="message" id="message" role="status" aria-live="polite"></div>
</form>
<p class="hint" id="hint"></p>
</section></main>
<footer class="auth-footer">项目管理 · 素材复用 · 图片与视频创作</footer>
<script>
let mode='login',bootstrap=false;const $=s=>document.querySelector(s);fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.authenticated)location.href='/studio.html';bootstrap=x.needsBootstrap;if(bootstrap){mode='register';document.body.classList.add('register');$('#registerTab').classList.add('active');$('#loginTab').classList.remove('active');$('#submit').textContent='创建管理员账号';$('#subtitle').textContent='首次使用：创建管理员账号。现有素材和结果将归此账号。';$('#hint').textContent='首次管理员不需要邀请码。'}});function setMode(x){mode=x;document.body.classList.toggle('register',x==='register');$('#loginTab').classList.toggle('active',x==='login');$('#registerTab').classList.toggle('active',x==='register');$('#submit').textContent=x==='login'?'登录':(bootstrap?'创建管理员账号':'注册并登录')}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#message').textContent='';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value,invite:$('#invite').value})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('td-csrf',d.csrf);location.href='/studio.html'}catch(err){$('#message').textContent=err.message}finally{$('#submit').disabled=false}};</script>
</body>
</html>
