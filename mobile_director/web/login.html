<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theodore 导演台登录</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:#eef1f7;font:15px system-ui;padding:20px}.card{width:min(430px,100%);background:#141823;border:1px solid #2b3344;border-radius:22px;padding:28px;box-shadow:0 30px 80px #0008}h1{margin:0 0 8px;font-size:25px}p{color:#9da8ba;line-height:1.6}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1}button,input{width:100%;border-radius:11px;border:1px solid #343e52;padding:12px 14px;font:inherit}input{background:#0d1119;color:white;margin:6px 0 13px}button{background:#252c3a;color:#dce5f5;cursor:pointer}.primary{background:#8169ff;border-color:#8169ff;color:white;font-weight:700}.active{outline:2px solid #8169ff}.invite{display:none}.register .invite{display:block}.message{min-height:24px;color:#ff9f9f;margin-top:12px}.hint{font-size:13px}</style></head><body><main class="card"><h1>Theodore 导演台</h1><p id="subtitle">登录后访问你的素材与生成结果。</p><div class="tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">邀请码注册</button></div><form id="form"><label>账号<input id="username" autocomplete="username" required minlength="3"></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="10"></label><label class="invite">邀请码<input id="invite" autocomplete="off"></label><button class="primary" id="submit">登录</button><div class="message" id="message"></div></form><p class="hint" id="hint"></p></main><script>
let mode='login',bootstrap=false;const $=s=>document.querySelector(s);fetch('/api/auth/me').then(r=>r.json()).then(x=>{if(x.authenticated)location.href='/';bootstrap=x.needsBootstrap;if(bootstrap){mode='register';document.body.classList.add('register');$('#registerTab').classList.add('active');$('#loginTab').classList.remove('active');$('#submit').textContent='创建管理员账号';$('#subtitle').textContent='首次使用：创建管理员账号。现有素材和结果将归此账号。';$('#hint').textContent='首次管理员不需要邀请码。'}});function setMode(x){mode=x;document.body.classList.toggle('register',x==='register');$('#loginTab').classList.toggle('active',x==='login');$('#registerTab').classList.toggle('active',x==='register');$('#submit').textContent=x==='login'?'登录':(bootstrap?'创建管理员账号':'注册并登录')}$('#loginTab').onclick=()=>setMode('login');$('#registerTab').onclick=()=>setMode('register');$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;$('#message').textContent='';try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value,invite:$('#invite').value})}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.setItem('td-csrf',d.csrf);location.href='/'}catch(err){$('#message').textContent=err.message}finally{$('#submit').disabled=false}};</script></body></html>
