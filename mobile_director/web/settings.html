<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 与账号设置 · Theodore</title><link rel="stylesheet" href="/studio-v2.css"><style>body{overflow:auto;background:#f5f5f5}.settings-shell{max-width:820px;margin:38px auto;padding:0 20px}.settings-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.settings-head h1{font-size:26px;margin:4px 0}.settings-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;margin:14px 0}.settings-card h2{font-size:16px;margin:0 0 6px}.settings-card>p{font-size:11px;color:var(--muted);line-height:1.6}.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.api-grid label{display:grid;gap:5px;font-size:10px;color:var(--muted)}.api-grid label.wide{grid-column:1/-1;margin:0}.api-grid input,.api-grid select{height:36px;border:1px solid #c8c6c4;border-radius:5px;padding:0 9px;font-size:12px}.api-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.safe-note{background:#eff6fc;color:#0f548c;padding:10px;border-radius:5px;font-size:10px}.identity-row{display:flex;justify-content:space-between;align-items:center}.identity-row h3{font-size:14px;margin:0}.identity-row p{margin:4px 0 0;font-size:10px;color:var(--muted)}@media(max-width:600px){.api-grid{grid-template-columns:1fr}.api-grid label.wide{grid-column:auto}}</style></head><body><header class="appbar"><a class="brand" href="/studio.html"><span class="brand-mark">T</span><span>Theodore 设置</span></a><div class="app-actions"><a class="legacy-link" href="/account.html">管理员与额度</a><a class="primary" href="/studio.html">返回新版导演台</a></div></header><main class="settings-shell"><div class="settings-head"><div><span class="eyebrow">Personal configuration</span><h1>API 与账号设置</h1></div><span class="status-pill" id="apiStatus">读取中</span></div><section class="settings-card"><h2>自己的 OpenAI-compatible API</h2><p>剧本拆解、图片生成、多模态分类和语义检索分别选择模型。Key 只保存在本机数据库，不会进入公开素材或制作同款配方。</p><form id="apiForm"><div class="api-grid"><label class="wide">Base URL<input id="baseUrl" placeholder="https://api.openai.com/v1" required></label><label class="wide">API Key<input id="apiKey" type="password" autocomplete="new-password" placeholder="留空表示保留已保存的 Key"><small id="keyHint"></small></label><label>文本/剧本模型<input id="textModel" required></label><label>图片生成模型<input id="imageModel" required></label><label>多模态分类模型<input id="classificationModel" placeholder="留空使用文本模型"></label><label>Embedding 模型<input id="embeddingModel" placeholder="可选；留空仅使用关键词检索"></label><label>默认图片尺寸<select id="imageSize"><option>1536x1024</option><option>1024x1536</option><option>1024x1024</option><option>auto</option></select></label></div><p class="safe-note">分类会发送当前素材的压缩预览或视频帧，以及当前工作空间的实体名称供匹配；不发送项目原文、实体详细设定或 API 密钥。未配置 Embedding 模型时仅使用关键词检索。</p><div class="api-actions"><button class="secondary" type="button" id="testApi">测试连接</button><button class="primary" type="submit">保存配置</button></div></form></section><section class="settings-card"><div class="identity-row"><div><h3 id="identity">当前账号</h3><p>公开素材仍需逐项主动发布，默认保持私有。</p></div><button class="secondary" id="logout">退出登录</button></div></section><div class="toast" id="toast"></div></main><script src="/settings.js"></script></body></html>
