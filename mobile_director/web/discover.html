<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theodore 开放素材库</title><link rel="stylesheet" href="/studio-v2.css"><link rel="stylesheet" href="/discover.css"><link rel="stylesheet" href="/acceptance-ui.css"></head><body>
<header class="appbar"><a class="brand" href="/discover.html"><span class="brand-mark">T</span><span>Theodore 素材广场</span><em>Beta</em></a><div class="app-actions"><a class="legacy-link" href="/studio.html">进入导演台</a><a class="primary" id="loginLink" href="/login.html?next=/discover.html">登录后制作</a></div></header>
<div class="discovery-shell"><aside class="sidebar"><nav aria-label="主导航"><a href="/studio.html?view=overview">项目总览</a><a href="/studio.html?view=video">视频编辑与生成</a><a href="/studio.html?view=image">图片编辑与生成</a><a href="/studio.html?view=script">文本编辑与生成</a><a href="/studio.html?view=assets">素材管理</a><a href="/studio.html?view=tasks">任务与版本</a><a href="/studio.html?view=deliveries">成片与交付</a><a class="active" href="/discover.html" aria-current="page">共享素材库</a></nav><div class="sidebar-footer"><a href="/settings.html">API 与账号设置</a></div></aside><main class="discover"><section class="hero"><span class="eyebrow">Theodore Shared Library</span><h1>找到能直接进入创作的素材</h1><p>浏览创作者主动公开的人物、场景和生成成果。预览无需登录，制作同款会先打开可编辑草稿。</p><label class="discover-search"><span>⌕</span><input id="search" placeholder="搜索人物、服饰、场景、角度、气氛或用途"></label></section><section class="discover-meta"><div><b id="total">0</b><span>项公开素材</span></div><p>默认署名 · 不提供原图下载 · 制作前可修改当前生成器参数</p></section><section class="discover-grid" id="grid"><div class="loading">正在读取公开素材…</div></section></main></div>
<div class="modal" id="remixModal" hidden><form class="dialog remix-dialog" id="remixForm"><div class="dialog-head"><div><span class="eyebrow">制作同款</span><h2 id="remixTitle">编辑生成草稿</h2></div><button type="button" data-close>×</button></div><div class="remix-source"><img id="remixPreview" alt=""><p>来源：<b id="attribution">—</b><small>只引用公开预览，不复制原始文件</small></p></div><label>提示词<textarea id="remixPrompt" rows="5"></textarea></label><div class="form-row"><label>画幅<select id="remixAspect"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:3</option></select></label><label>时长（秒）<input id="remixDuration" type="number" min="1" max="30" step=".5" value="5"></label></div><p class="draft-note">这是草稿，不会自动调用模型或产生费用。</p><div class="dialog-actions"><button type="button" class="secondary" data-close>取消</button><button class="primary" type="submit">保存为我的创作草稿</button></div></form></div><div class="toast" id="toast"></div><script src="/discover.js"></script></body></html>
